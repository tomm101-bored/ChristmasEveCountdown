<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Eve Countdown</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["ui-sans-serif", "system-ui", "Segoe UI", "Inter", "Arial"],
            },
          },
        },
      };
    </script>

    <style>
      /* Subtle sparkle */
      .sparkle {
        background:
          radial-gradient(650px 350px at 15% 20%, rgba(255,255,255,.14), transparent 60%),
          radial-gradient(700px 380px at 80% 30%, rgba(255,255,255,.10), transparent 55%),
          radial-gradient(700px 450px at 55% 85%, rgba(255,255,255,.08), transparent 60%);
      }
      /* Smooth text */
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    </style>
  </head>

  <body class="min-h-screen text-white">
    <!-- Background -->
    <div class="fixed inset-0 -z-10 bg-gradient-to-br from-rose-700 via-red-700 to-emerald-700"></div>
    <div class="fixed inset-0 -z-10 sparkle opacity-80"></div>

    <main class="min-h-screen flex items-center justify-center p-6">
      <section class="w-full max-w-4xl">
        <!-- Top pill -->
        <div class="mx-auto mb-6 w-fit rounded-full border border-white/15 bg-white/10 px-4 py-2 text-xs text-white/85 backdrop-blur">
          🎄 Countdown to <span class="font-semibold">Christmas Eve</span>
        </div>

        <!-- Card -->
        <div class="rounded-3xl border border-white/15 bg-white/10 backdrop-blur-xl shadow-[0_20px_60px_-30px_rgba(0,0,0,0.7)] overflow-hidden">
          <div class="p-6 md:p-10">
            <div class="flex flex-col md:flex-row items-center gap-6 md:gap-10">
              <!-- Left image -->
              <img
                class="h-24 w-24 md:h-28 md:w-28 rounded-2xl bg-white/10 p-2 ring-1 ring-white/15 shadow-lg"
                src="https://yt3.ggpht.com/ka3eXAS9ioVz8WsyYkzsbWMWFw4lIOEfdbY1Spab_QBa2dexQHY2EPZ5CojAXj1py6pAoQmUNqRgXg=s612-rw-nd-v1"
                alt="Christmas"
                draggable="false"
              />

              <!-- Center -->
              <div class="flex-1 text-center md:text-left">
                <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">
                  Christmas is soon!!!
                </h1>
                <p class="mt-2 text-sm md:text-base text-white/80">
                  Counting down to <span class="font-semibold">Dec 24</span> (your local time).
                </p>

                <!-- Countdown tiles -->
                <div class="mt-6 grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div class="rounded-2xl bg-white/10 border border-white/15 p-4 text-center">
                    <div id="days" class="text-3xl md:text-4xl font-black">0</div>
                    <div class="mt-1 text-xs tracking-wide text-white/75">DAYS</div>
                  </div>
                  <div class="rounded-2xl bg-white/10 border border-white/15 p-4 text-center">
                    <div id="hours" class="text-3xl md:text-4xl font-black">00</div>
                    <div class="mt-1 text-xs tracking-wide text-white/75">HOURS</div>
                  </div>
                  <div class="rounded-2xl bg-white/10 border border-white/15 p-4 text-center">
                    <div id="minutes" class="text-3xl md:text-4xl font-black">00</div>
                    <div class="mt-1 text-xs tracking-wide text-white/75">MINUTES</div>
                  </div>
                  <div class="rounded-2xl bg-white/10 border border-white/15 p-4 text-center">
                    <div id="seconds" class="text-3xl md:text-4xl font-black">00</div>
                    <div class="mt-1 text-xs tracking-wide text-white/75">SECONDS</div>
                  </div>
                </div>

                <!-- Status line -->
                <div class="mt-5 text-xs text-white/70">
                  <span id="targetText"></span>
                  <span class="mx-2">•</span>
                  <span id="nowText"></span>
                </div>

                <!-- Released message -->
                <div
                  id="done"
                  class="hidden mt-6 rounded-2xl bg-white/10 border border-white/15 p-4"
                >
                  <div class="text-lg font-bold">🎁 It’s Christmas Eve!</div>
                  <div class="text-sm text-white/75">Merry Christmas 🎄</div>
                </div>
              </div>

              <!-- Right image -->
              <img
                class="h-24 w-24 md:h-28 md:w-28 rounded-2xl bg-white/10 p-2 ring-1 ring-white/15 shadow-lg"
                src="https://yt3.ggpht.com/ka3eXAS9ioVz8WsyYkzsbWMWFw4lIOEfdbY1Spab_QBa2dexQHY2EPZ5CojAXj1py6pAoQmUNqRgXg=s612-rw-nd-v1"
                alt="Christmas"
                draggable="false"
              />
            </div>
          </div>

          <!-- Footer strip -->
          <div class="px-6 md:px-10 py-4 border-t border-white/10 bg-black/10 flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between text-xs text-white/70">
            <span>Tip: keep this tab open and it updates every second.</span>
            <span class="opacity-80">Made by Tomm</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      const elDays = document.getElementById("days");
      const elHours = document.getElementById("hours");
      const elMinutes = document.getElementById("minutes");
      const elSeconds = document.getElementById("seconds");
      const elTargetText = document.getElementById("targetText");
      const elNowText = document.getElementById("nowText");
      const elDone = document.getElementById("done");

      const pad2 = (n) => String(n).padStart(2, "0");

      function getNextChristmasEve(now = new Date()) {
        const year = now.getFullYear();
        // Local time: Dec 24 00:00:00
        let target = new Date(year, 11, 24, 0, 0, 0, 0);
        if (now >= target) target = new Date(year + 1, 11, 24, 0, 0, 0, 0);
        return target;
      }

      function tick() {
        const now = new Date();
        const target = getNextChristmasEve(now);
        const diff = target - now;

        elTargetText.textContent = `Target: ${target.toLocaleString([], {
          year: "numeric",
          month: "short",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        })}`;

        elNowText.textContent = `Now: ${now.toLocaleString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        })}`;

        if (diff <= 0) {
          elDone.classList.remove("hidden");
          elDays.textContent = "0";
          elHours.textContent = "00";
          elMinutes.textContent = "00";
          elSeconds.textContent = "00";
          return;
        } else {
          elDone.classList.add("hidden");
        }

        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        elDays.textContent = String(days);
        elHours.textContent = pad2(hours);
        elMinutes.textContent = pad2(minutes);
        elSeconds.textContent = pad2(seconds);
      }

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
